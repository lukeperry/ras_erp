[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ras_erp"
authors = [
    { name = "RAS-ERP", email = "dev@ras-erp.local" },
]
description = "Sales & Operations customizations on top of ERPNext (Lead-to-Cash pipeline)."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # left empty on purpose: reuse ERPNext/Frappe's dependencies, do not duplicate here
]

[tool.bench.dev-dependencies]

[project.optional-dependencies]

[tool.ruff]
line-length = 110
target-version = "py310"
